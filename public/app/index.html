<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My maps — BusMaps.uk</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/app/app.css">
  <!-- PILOT: pilot banner + title marker. Delete with docs/PILOT.md. -->
  <script src="/js/site-banner.js" defer></script>
</head>
<body>
  <header class="site-header"><div class="container"><nav class="nav">
    <a class="brand" href="/"><span class="logo">🚌</span> BusMaps.uk</a>
    <span class="spacer"></span>
    <a class="navlink" href="/app">My maps</a>
    <a class="navlink" id="brandingLink" href="/app/branding" style="display:none">Public details</a>
    <a class="navlink" id="reviewLink" href="/app/review" style="display:none" data-eev-hide>Review</a>
    <a class="navlink" id="adminLink" href="/app/admin" style="display:none" data-eev-hide>Admin</a>
    <span class="navlink" id="whoami"></span>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button" style="display:none">Sign out</button>
  </nav></div></header>

  <main class="app-main">
    <div class="app-sub">
      <h1 id="dashTitle">My maps</h1>
      <span class="spacer"></span>
      <button class="btn btn-primary btn-sm" id="requestBtn" type="button" style="display:none">Request a map</button>
    </div>
    <p class="hint-line" id="dashIntro">Open a map to recolour its routes, show or hide points of interest, then save a new version and download print-ready sheets. Layout and geometry stay with the operator.</p>
    <div class="quota-bar" id="quotaBar" style="display:none"></div>

    <div id="maps" class="map-list" aria-live="polite">
      <div class="empty">Loading your maps…</div>
    </div>
  </main>

  <!-- Request-a-map dialog -->
  <dialog id="requestDialog" class="dialog">
    <form id="requestForm" method="dialog">
      <h2 class="mt-0">Request a map</h2>
      <p class="hint-line" id="requestQuota"></p>
      <div class="field">
        <label>Type of map</label>
        <div class="radio-row">
          <label class="radio"><input type="radio" name="kind" value="area" checked> <span><strong>Area</strong> — a whole town or parish</span></label>
          <label class="radio"><input type="radio" name="kind" value="place"> <span><strong>Place</strong> — a single point (shop, school, centre…)</span></label>
        </div>
      </div>
      <div class="field">
        <label for="reqName">Name</label>
        <input id="reqName" name="name" type="text" required maxlength="120" placeholder="e.g. Ramsey, or Tesco Extra">
      </div>
      <div class="field">
        <label for="reqSubject">Which town / place exactly? <span class="hint">— optional, helps us find it</span></label>
        <input id="reqSubject" name="subject" type="text" maxlength="200" placeholder="e.g. Ramsey, Cambridgeshire">
      </div>
      <div class="field">
        <label for="reqNote">Anything we should know? <span class="hint">— optional</span></label>
        <textarea id="reqNote" name="note" maxlength="2000" placeholder="Routes to emphasise, points of interest, deadlines…"></textarea>
      </div>
      <div class="notice" id="requestMsg"></div>
      <div class="dialog-actions">
        <button class="btn btn-ghost btn-sm" type="button" id="requestCancel">Cancel</button>
        <span class="grow"></span>
        <button class="btn btn-primary btn-sm" type="submit" id="requestSubmit">Send request</button>
      </div>
    </form>
  </dialog>

  <script src="/js/editor-eye-view.js"></script>
  <script src="/js/app-dashboard.js" defer></script>
</body>
</html>
