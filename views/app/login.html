<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — BusMaps.uk</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/app/app.css">
  <!-- PILOT: pilot banner + title marker. Delete with docs/PILOT.md. -->
  <script src="/js/csrf.js"></script>
  <script src="/js/account-guard.js"></script>
  <script src="/js/site-banner.js" defer></script>
</head>
<body>
  <header class="site-header"><div class="container"><nav class="nav">
    <a class="brand" href="/"><span class="logo">🚌</span> BusMaps.uk</a>
    <span class="spacer"></span>
    <a class="navlink" href="/">Home</a>
  </nav></div></header>

  <main class="app-main">
    <div class="login-card card">
      <h1 class="mt-0">Sign in</h1>
      <p class="hint-line">Enter your email and we'll send you a one-time sign-in link — no password needed.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@organisation.org">
        </div>
        <button class="btn btn-primary" type="submit" id="loginBtn">Send me a sign-in link</button>
        <div class="form-msg" id="loginMsg"></div>
      </form>

      <p class="hint-line" style="margin-top:18px">
        Not a customer yet? <a href="/apply.html">Apply to join</a>.
      </p>
    </div>
  </main>

  <script src="/js/app-login.js" defer></script>
</body>
</html>
