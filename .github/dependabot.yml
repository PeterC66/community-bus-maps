# Dependency update PRs. There was no dependabot config at all until 2026-08-19,
# and no workflow ran `npm audit` either, so four high-severity advisories sat in
# the production tree unnoticed (technical-audit_2026-08-19 S2).
#
# Dependabot proposes; .github/workflows/audit.yml is what actually fails the
# build. The two are complements: Dependabot will not tell you that an advisory
# you chose to defer has been sitting there for six weeks.
#
# Grouped and weekly on purpose - this is a one-maintainer project, and a daily
# drip of single-package PRs is how a bot ends up ignored.
#
# EVERY LABEL NAMED BELOW MUST EXIST IN THE REPOSITORY, and neither of them did
# until 2026-09-10. Dependabot does not create a label it is asked for: it opens
# the PR anyway and its FIRST comment is a configuration error saying the label
# could not be found. So every PR this file has ever raised led with an error
# instead of a diff, and none was labelled. It cost a real one. PR #173, "Bump
# sharp from 0.35.3 to 0.35.4", was opened on 2026-08-31, sat unlabelled and
# unread for ten days, and was auto-closed on 2026-09-10 by a manual upgrade of
# the same package - the advisory that upgrade fixes (GHSA-rgj7-g3m4-5g8c,
# libheif heap overflows) was published inside that window and turned `main` red.
# The fix was on offer before the problem existed. `dependencies` and
# `needs-rebaseline` now exist; if you add another label here, create it first.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps arrive as one PR; the test workflow gates them.
      routine:
        patterns: ['*']
        update-types: [minor, patch]
    # Majors come as their own PR: sharp in particular cannot be merged on a
    # green test run alone - it needs `npm run verify` and a byte re-baseline
    # (see the Dockerfile's note and scripts/audit-allowlist.json).
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]

  # The Dockerfile's FROM is pinned by digest (technical-audit_2026-08-19 V6), so
  # it no longer picks up base-image security patches on its own. This entry is
  # the other half of that trade: the pin stops the bytes moving unannounced, and
  # this stops the pin quietly ageing into an unpatched Debian. Monthly, because
  # a base-image bump is not a merge-on-green change -- it needs `npm run verify`
  # and the digest recorded in a CHANGELOG.d/ fragment.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # needs-rebaseline is not decoration. A base-image bump can change the
    # rasterised TEXT pixels with identical SVG bytes going in and the same
    # sharp/libvips versions reported -- measured on #64 (node 26-slim), where
    # the text probe moved and every check still went green, because the image
    # job gates on --strict-fonts and not on the pixel comparison. The label is
    # what stops that PR looking like a routine bump in the list.
    #
    # AND A BASE-IMAGE BUMP IS A MULTI-FILE CHANGE THAT DEPENDABOT CAN ONLY DO
    # ONE FILE OF. #64 edits the Dockerfile alone, so `test-node-pin.mjs` fails
    # it five ways - package.json `engines.node` still says >=24, and audit.yml,
    # render-parity.yml and test.yml each install Node 24 while the image is
    # node:26. That test is right and the PR is incomplete; merging it green is
    # not available, and neither is merging it red. Taking one means bumping the
    # engines floor and the three workflow pins in the same change, THEN
    # re-baselining the render. Do not treat the red as flakiness.
    labels: [dependencies, needs-rebaseline]
