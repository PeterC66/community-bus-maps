# Runs the portal's own test suite. Nothing ran it until 2026-08-19: the only
# workflow in this repo was render-parity.yml, whose `paths:` filter meant a
# change to src/server.js, src/db/, src/auth/, src/publish/ or anything in
# scripts/ triggered no CI at all (technical-audit_2026-08-19 V1).
#
# Deliberately NO `paths:` filter. The point of this workflow is that there is
# no edit to this repository which is not covered by it.
#
# The suite needs no fixtures, no network and no secrets - it builds its own
# SQLite under DATA_DIR - so it runs on a fresh clone. Checked before wiring it
# up: it passes with no .env and an empty data dir, and it genuinely goes RED on
# real drift (a one-character edit to a footer block failed check-chrome with
# exit 1). A gate nobody has watched fail is not a gate.

name: tests

# ONE RUN PER REF (OA-232 Tier 2.3, the 2026-09-03 review's portal-ops W2).
# None of the four workflows had a concurrency group, so a second push to a PR
# left the first run going: two runs of the byte gates against the same branch,
# competing for the same self-hosted-shaped work, and a stale run able to finish
# AFTER the new one and be the last verdict a reader sees. `cancel-in-progress`
# is safe for every job here because none of them writes anything outside its own
# runner -- these are checks, not deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 because scripts/test-schema-compat.mjs reads git history to
      # find the PREVIOUS schema and runs it against this one. On the default
      # shallow clone it reports SKIPPED, honestly - and a gate that skips on
      # every CI run is a gate that has never run (technical-audit_2026-08-25 N13).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 24 to match the Dockerfile's base image: node:sqlite is the store, and
      # it is still flagged experimental, so the runtime is not a free variable.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # FALSIFY THE RUNNER FIRST. `npm test` is no longer a chain of commands
      # this file can read - it is one script that DISCOVERS the tests, so a bug
      # in it does not make one test wrong, it makes the whole verdict wrong in
      # the reassuring direction. Six cases on scratch repositories under the
      # temp dir, plus two controls; ~3 s, no database, no fixture repository.
      - name: prove the test runner can go red
        run: npm run test:prove-red-run-tests

      - name: npm test
        run: npm test

      # FILE HYGIENE — a byte-order mark, trailing whitespace, a missing final
      # newline (buses-data OA-241). This repository was carrying 46 BOMs when the
      # checker was first pointed at it, among them CLAUDE.md, README.md, twelve
      # docs/*.md, twelve views/app/*.html and src/server.js. A BOM sits invisibly
      # before the first character, so it breaks any edit matching the start of a
      # file while appearing in no diff, no review and no test.
      #
      # THE CHECKOUT TAKES NO TOKEN, and that is the whole point of where the
      # checker lives. It was written in buses-data, which is PRIVATE, so a step
      # here would have needed CROSS_REPO_PAT2 — and hanging a hygiene check off
      # that token is exactly what buses-data's own `docs` job was split out to
      # avoid. Moved to claude-skills, which is public, this workflow stays in the
      # secret-free tier it is already in. sparse-checkout because only `tools/`
      # is wanted; claude-skills carries every generator and none of it is read.
      - name: Checkout the hygiene checker from claude-skills
        uses: actions/checkout@v7
        with:
          repository: PeterC66/claude-skills
          path: claude-skills
          sparse-checkout: tools

      # Falsify it first — 24 cases, each exemption class broken in BOTH
      # directions, because widening an exemption produces a false PASS rather
      # than a false finding.
      - name: prove the file-hygiene checker can go red
        run: node claude-skills/tools/prove-red-file-hygiene.mjs

      # NOT the mixed-line-ending half, which cannot fire here and is not meant
      # to: actions/checkout builds a uniform tree by construction, so mixed EOL
      # is a property of a WORKING TREE that only .githooks/pre-commit can ask
      # about. This step is genuinely narrower than the checker it runs — do not
      # remove the working-tree half on noticing CI never reports it.
      #
      # This repository declares no `.file-hygiene.json` and needs none: it has no
      # generated corpus and no verbatim records, so the bare rules are right.
      - name: files carry no BOM, no trailing whitespace, no missing newline
        run: node claude-skills/tools/check-file-hygiene.mjs --root .
