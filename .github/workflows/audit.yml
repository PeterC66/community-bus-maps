# Dependency advisories in the PRODUCTION tree.
#
# Not a bare `npm audit --audit-level=high`: on the day this landed the tree
# already carried two known, judged, deferred advisories (sharp, @fastify/static),
# so a bare audit would have been red from its first run - and a check that is
# red on day one gets muted inside a week. technical-audit_2026-08-19 V4 already
# names gate fatigue as a live problem here, so the gate is written to start
# green and only go red on something that deserves attention:
#   - a high/critical advisory not listed in scripts/audit-allowlist.json, or
#   - a new advisory against a module that was already deferred, or
#   - a deferral whose `until` date has passed.
# All three were tested by hand before this workflow was committed.
#
# Weekly as well as per-push, because the dependency tree can turn red without
# anyone touching the repository - that is the normal way a CVE arrives.

name: dependency audit

# ONE RUN PER REF (OA-232 Tier 2.3, the 2026-09-03 review's portal-ops W2).
# None of the four workflows had a concurrency group, so a second push to a PR
# left the first run going: two runs of the byte gates against the same branch,
# competing for the same self-hosted-shaped work, and a stale run able to finish
# AFTER the new one and be the last verdict a reader sees. `cancel-in-progress`
# is safe for every job here because none of them writes anything outside its own
# runner -- these are checks, not deploys.
#
# THE GROUP INCLUDES THE EVENT NAME (2026-09-04, OA-242), and that is
# load-bearing rather than tidy. On `main` the events `push`, `schedule` and
# `workflow_dispatch` all resolve `github.ref` to `refs/heads/main`, so without
# the event name they share one group and a push CANCELS a scheduled run --
# and `verify.yml` (daily) and `audit.yml` (Mondays) are scheduled precisely
# because they can break with nobody touching this repository. A push must not
# be able to cancel the run that carries a guarantee. The full reasoning is in
# buses-data `.github/workflows/gates.yml`, whose group has had this form since
# 2026-09-03; these four were written first and were never backported.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 07:15 UTC - a working morning, so a red result gets looked at.
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # 20, NOT 10, since 2026-09-05 (buses-data OA-243). Ten was chosen because a
    # job of this shape has no business taking ten minutes, and on a normal day
    # it takes twelve SECONDS. On 2026-09-04 the registry (or the runners' egress
    # to it) slowed by two orders of magnitude with no package file touched --
    # `npm ci` 3-5 minutes, `npm audit --omit=dev` 4-5 minutes -- and this job
    # was killed THREE times in a day, every time AFTER its check had printed
    # `OK - nothing new, and no deferral has expired.` (PR #223: the pass at
    # 10:12:34.435, the kill at 10:12:34.452). The verdict was reached and the
    # clock threw it away, and a gate that is red for a reason unrelated to what
    # it measures teaches people to re-run without reading. Its siblings absorb
    # the same loss (`test` 15, `verify` 30, `render-parity` 20); this one could
    # not, because both of its steps are the slow ones. The slowness recovered
    # by itself the same afternoon (attempt 2 of the third kill: eight seconds),
    # so 20 is a budget for a bad afternoon, not a new normal -- if this job
    # regularly takes minutes, the question is why it makes two round trips to
    # the registry when `npm ci` already resolves against the committed lockfile.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # `npm ci` so the audit reads the committed lockfile, not a fresh resolve.
      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: node scripts/audit-check.mjs
