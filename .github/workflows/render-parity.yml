# Does Linux rasterise a sheet to the same bytes as the Windows laptop?
#
# `npm run verify` cannot answer this: it fails only on the SVG comparison, and
# SVG generation is pure JavaScript. See the header of scripts/render-parity-probe.mjs.
#
# The probe builds its own SVGs in code, so NO map data, fixtures or customer
# data are involved and this is safe to run in public CI.
#
# Two jobs on purpose:
#   image  — the real deployment target (whatever the Dockerfile FROM says).
#   runner — plain Ubuntu, which has system fonts installed.
# If `geometry` matches in both but `text` only matches on the runner, the
# problem is fonts missing from the image, not libvips — a one-line Dockerfile
# fix rather than a platform problem.
#
# Advisory on the BASELINE comparison by design: geometry/text bytes differing
# from the Windows reference is expected forever on Linux (different glyph
# outlines, see docs/GO-LIVE.md 2.5) and would be a permanent false positive.
#
# NOT advisory on font resolution. The image job runs with --strict-fonts
# (2026-08-13, after fontconfig going missing sent every live sheet to
# Liberation Mono for four days while this probe still reported PASS): whether
# "Arial" resolved to a proportional face has no legitimate "differs but fine"
# outcome, so that one check fails the build.

# EVERY JOB HERE CARRIES A timeout-minutes, AND THAT IS NOT BOILERPLATE.
#
# On 2026-08-20 the `runner` job below sat in "Rasterise the probes on the bare
# runner" for FOUR HOURS, on a step that had taken under a minute on every
# previous run. GitHub's default job timeout is SIX HOURS, so it was neither red
# nor green: it was simply pending, and `gh pr checks` reported it as pending
# alongside the passing jobs.
#
# It is INTERMITTENT -- it hung on two of three runs of the same commit, and
# passed the third in about 40 seconds with every probe number matching. So it
# is NOT the sharp 0.35 bump that PR carried, which is what it looked like at
# first; and it is not a one-off either. Unexplained as of 2026-08-20.
#
# MEASURED 2026-08-29 OVER THE LAST 40 RUNS, AND HALF THE PARAGRAPH THAT USED TO
# STAND HERE WAS OUT OF DATE. Six of forty runs were cancelled by a timeout --
# about one in seven -- and they break down like this:
#
#   run 32329906432  2026-08-20  runner  Rasterise on the bare runner   (4h43m)
#   run 32350002412  2026-08-20  runner  Rasterise on the bare runner
#   run 32359457809  2026-08-20  IMAGE   Rasterise inside the image
#   run 32433895083  2026-08-21  IMAGE   Rasterise inside the image
#   run 32433897938  2026-08-21  runner  Rasterise on the bare runner
#   run 32868999654  2026-08-25  runner  Rasterise on the bare runner
#
# So: the claim that "the image job has never hung and it is the diagnostic
# control that is flaky, not the thing being controlled" is FALSE. The image job
# -- the actual deployment target -- hung on 2026-08-20 and again on 2026-08-21.
# What IS true and holds across all six: it is always the rasterise step, never
# the checkout, the build or `npm ci`; and in every run exactly one of the two
# jobs hung while its sibling finished normally in about 35 seconds, so it is
# not the probe SVGs and not the commit under test.
#
# WHY SIX OCCURRENCES TAUGHT US NOTHING, which is the real finding. Every one of
# them produced an EMPTY log. That was structural, not luck: render-parity-probe.mjs
# printed nothing until both rasterisations had finished, so a hang anywhere in
# the work was guaranteed to leave no trace. "Cause still unknown" was a property
# of the instrument. Fixed 2026-08-29 -- the probe now writes one stderr line per
# phase with an elapsed clock, and prints libvips build, sharp's chosen
# thread-pool size and the CPU count before it starts, so the SEVENTH hang will
# name the phase it died in and say what was different about that runner.
#
# The timeout is what makes the flakiness survivable, and it is now at the STEP
# as well as the job: a hang ends in 5 minutes rather than 20, and 20 rather than
# GitHub's six-hour default. A job killed by its own timeout is reported as
# `cancelled`; a STEP killed by its own timeout is reported as `failure` -- so
# the six above are invisible in any count of failures and every hang since
# the step cap landed (2026-08-29) is countable.
#
# THE SEVENTH AND EIGHTH HANGS ANSWERED THE QUESTION (2026-08-29 and 2026-09-03,
# runs 33233095649 and 33750970921, OA-052). Both did ALL their work in under
# two seconds and printed the complete verdict; the seventh then sat silent,
# and the eighth -- the first with the probe's in-process watchdog armed --
# printed `work complete, exiting 0` and `process 'exit' event reached, code 0`
# and then NOTHING for five minutes. No handle dump: the JS exit handlers ran
# and the process stuck in native teardown after them, where no JS timer can
# fire because the event loop is already gone. The rasterisation was never
# involved, and the probe's own watchdog was placed in the one process that
# cannot see the fault.
#
# SO THE GUARD IS OUTSIDE THE PROCESS (2026-09-05). render-parity-probe.mjs now
# runs itself as a child under a supervisor that loads nothing native, reads
# the `PROBE VERDICT: exit <n>` line the child prints as its last act, and if
# the child is still alive a grace period after that line, kills it and exits
# <n>. The step's `| tee` and the Report step see the same stdout as before
# plus that one line. A hang in the WORK is still a hang -- the rescue arms
# only on the verdict line -- and still ends in this step's timeout-minutes;
# scripts/test-render-parity-supervisor.mjs proves both directions. Each
# rescue prints an Actions ::warning:: naming OA-052, so the frequency stays
# visible: a green run with that warning is a hang that was outlived, and a
# red run at the step cap with no verdict line is a hang in the work, which
# would be new.
#
# IF YOU COME TO INVESTIGATE: read the `[probe +Ns]` breadcrumbs first. Compare
# the environment line of a hung run against a passing one on the same job.
#
# A check that cannot reach a verdict is worse than one that fails, because
# nothing chases it. That is the same defect as deliver-map.mjs discarding its
# health check's exit code (audit O3) and as buses-data's gate board sitting red
# for twelve days because a scheduled failure is silent (audit V2): in all three
# the machinery ran and the result went nowhere. A bounded timeout turns a hang
# into a result.

name: render parity

# ONE RUN PER REF (OA-232 Tier 2.3, the 2026-09-03 review's portal-ops W2).
# None of the four workflows had a concurrency group, so a second push to a PR
# left the first run going: two runs of the byte gates against the same branch,
# competing for the same self-hosted-shaped work, and a stale run able to finish
# AFTER the new one and be the last verdict a reader sees. `cancel-in-progress`
# is safe for every job here because none of them writes anything outside its own
# runner -- these are checks, not deploys.
#
# THE GROUP INCLUDES THE EVENT NAME (2026-09-04, OA-242), and that is
# load-bearing rather than tidy. On `main` the events `push`, `schedule` and
# `workflow_dispatch` all resolve `github.ref` to `refs/heads/main`, so without
# the event name they share one group and a push CANCELS a scheduled run --
# and `verify.yml` (daily) and `audit.yml` (Mondays) are scheduled precisely
# because they can break with nobody touching this repository. A push must not
# be able to cancel the run that carries a guarantee. The full reasoning is in
# buses-data `.github/workflows/gates.yml`, whose group has had this form since
# 2026-09-03; these four were written first and were never backported.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
    paths:
      - 'scripts/render-parity-probe.mjs'
      - 'scripts/render-parity-baseline.json'
      - 'src/render/**'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/render-parity.yml'
  pull_request:
    paths:
      - 'scripts/render-parity-probe.mjs'
      - 'scripts/render-parity-baseline.json'
      - 'src/render/**'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/render-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

# EVERY `run:` HERE PIPES INTO `tee`, AND UNTIL 2026-08-29 THAT THREW THE EXIT
# CODE AWAY. GitHub's DEFAULT shell for `run:` on Linux is `bash -e {0}` -- note
# what is absent: `-o pipefail`. Without it the status of `a | b` is b's, so
# `node render-parity-probe.mjs --strict-fonts | tee probe-image.txt` reported
# TEE's success whatever the probe decided. The one check this workflow's own
# header calls "NOT advisory" -- the font-resolution gate, added 2026-08-13
# precisely because fontconfig had gone missing and every live sheet rendered in
# Liberation Mono for four days while this probe still said PASS -- could not
# fail this workflow. The same defect it exists to close, one layer up.
#
# `shell: bash` is documented as `bash --noprofile --norc -eo pipefail {0}`, so
# setting it once here fixes every step in the file. The two steps at the foot of
# the `image` job are the falsification: one shows a failing pipeline being
# CAUGHT under this default, the other reproduces the OLD default explicitly and
# shows the same pipeline being MISSED. Neither is decoration -- a fix to an exit
# code is invisible in every green run, and those two steps are the only place
# this one is ever visible again.
defaults:
  run:
    shell: bash

jobs:
  image:
    name: deployment image (Dockerfile FROM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: docker build -t cbm-parity .

      # What Arial actually resolves to is the whole question, so record the
      # font inventory rather than inferring it from the pixel hashes.
      - name: What fonts does the image have?
        run: |
          docker run --rm --entrypoint sh cbm-parity -c \
            'find / \( -name "*.ttf" -o -name "*.otf" \) 2>/dev/null | sort' | tee fonts-image.txt
          echo "count: $(wc -l < fonts-image.txt)"

      # --strict-fonts (not --strict): the baseline byte comparison is expected
      # to differ from the Windows reference forever (different glyph outlines by
      # design, see docs/GO-LIVE.md 2.5) so gating on it would be a permanent
      # false positive. Whether "Arial" resolved to a proportional face at all
      # has no legitimate "differs but fine" outcome -- added 2026-08-13 after
      # fontconfig going missing from the image sent every live sheet to
      # Liberation Mono for four days and this probe still reported PASS,
      # because nothing here failed the build on it.
      # timeout-minutes at the STEP, not just the job. This step takes ~35s on a
      # good run and has hung four times; capping it at 5 minutes turns a hang
      # into a result eight times sooner than the job cap did, and the
      # breadcrumbs the probe writes to stderr say which phase it died in
      # (OA-052/OA-103). Since 2026-09-05 a hang AFTER the verdict never reaches
      # this cap: the probe's supervisor ends it in ~25 s with the verdict's own
      # exit code and a ::warning::. Reaching this cap now means a hang in the
      # work itself, which no run has yet shown.
      - name: Rasterise the probes inside the image
        timeout-minutes: 5
        run: docker run --rm cbm-parity node scripts/render-parity-probe.mjs --strict-fonts | tee probe-image.txt

      - name: Report
        if: always()
        run: |
          {
            echo "## Deployment image — \`$(sed -n 's/^FROM \(node:[^@]*\).*/\1/p' Dockerfile | head -1)\`"
            echo
            echo 'The image the VPS will actually run.'
            echo
            echo '```'
            cat probe-image.txt
            echo '```'
            echo
            echo "<details><summary>Fonts present in the image ($(wc -l < fonts-image.txt))</summary>"
            echo
            echo '```'
            cat fonts-image.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # --- the two steps that make the pipefail fix visible ---------------------
      #
      # A fix to an exit code shows up in NO green run, which is how this one
      # survived from 2026-08-13 to 2026-08-29. These two steps are where it is
      # visible, and they are a pair on purpose: one proves the guard CATCHES,
      # the other proves there was something to catch. A control that has only
      # ever been seen to pass has not been shown to discriminate.
      - name: Prove a failing probe would actually fail this job
        run: |
          # Inherits the workflow default (`shell: bash` = -eo pipefail). If the
          # `defaults:` block at the top of this file is ever removed, this step
          # goes red -- which is the only warning anybody would get.
          if false | tee /dev/null; then
            echo "::error::a non-zero exit piped into tee reported SUCCESS. pipefail is off, so the --strict-fonts gate above is inert and this workflow cannot fail on a font regression."
            exit 1
          fi
          echo "pipefail is on: the probe's exit code reaches this job."

      - name: ...and that the old default really did miss it
        # `bash -e {0}` is GitHub's documented default for `run:` when no shell
        # is named -- exactly what every step in this file used until 2026-08-29.
        shell: bash -e {0}
        run: |
          if false | tee /dev/null; then
            echo "Confirmed: under the OLD default (bash -e, no pipefail) a failing probe piped into tee reports SUCCESS."
            echo "That is what made the --strict-fonts gate inert. The workflow default above is the fix."
          else
            echo '::warning::bash -e propagated a pipeline failure by itself, so this runner default already had pipefail and the fix above was belt-and-braces. Correct the header comment rather than leaving a claim nobody checked.'
          fi

  runner:
    name: ubuntu-latest (system fonts present)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Respect the lockfile: a different sharp build is exactly the variable
      # under test, so it must not float.
      - name: Install dependencies
        run: npm ci --omit=dev

      # Same 5-minute step cap as the image job: this is the step that sat for
      # FOUR HOURS on 2026-08-20 and has hung on four runs since (OA-052). The
      # same supervisor applies here: a post-verdict hang ends with the verdict.
      - name: Rasterise the probes on the bare runner
        timeout-minutes: 5
        run: node scripts/render-parity-probe.mjs | tee probe-runner.txt

      - name: Report
        if: always()
        run: |
          {
            echo '## Bare runner — `ubuntu-latest`'
            echo
            echo 'Linux with system fonts installed. Compare against the image job:'
            echo 'if `text` passes here but fails there, it is fonts in the image.'
            echo
            echo '```'
            cat probe-runner.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
