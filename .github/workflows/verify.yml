# The byte-identical gate, running somewhere other than one laptop.
#
# This is the workflow the audit asked for
# (Development Docs/technical-audit_2026-08-19.md, finding V2 — "the one thing
# to fix if only one thing gets fixed"). The product's central technical claim is
# that the same inputs produce the same bytes. `npm run verify` is what
# demonstrates that claim, and until 2026-08-20 it could only be demonstrated by
# the founder, on one machine, because the fixtures it needs were git-ignored —
# and it printed "skipping" and exited 0 everywhere else, so the absence looked
# like a pass.
#
# Both halves of the fix are needed for this file to mean anything:
#   1. buses-data now COMMITS an area fixture at Areas/_portal-fixture/, the way
#      it already committed a place one at Places/_portal-fixture/;
#   2. scripts/lib/fixtures.mjs FAILS rather than skips when there is no fixture,
#      so this job cannot go green by finding nothing.
#
# WHY THE THREE GATES ARE THREE STEPS rather than one `npm run verify`. They
# answer different questions and a reader of a red run should not have to open
# the log to learn which: verify:area is "does the portal reproduce a shipped
# TOWN sheet byte-for-byte", verify:place is the same for the vendored PLACE
# engine, and verify:defaults is "does each of the thirteen design/labels escape
# hatches still change something" — i.e. is any of them now dead code.
#
# WHAT THIS DOES NOT PROVE. Rasterisation. SVG generation is pure JavaScript and
# is expected to be byte-identical everywhere; the JPGs are not, because glyph
# outlines differ between Linux and the Windows laptop by design. That is what
# render-parity.yml is for, and why these gates compare SVGs only.
#
# NO SECRET, NO SECOND CHECKOUT, SINCE 2026-09-18 (buses-data OA-398, R5 of the
# 2026-09-17 process review). This workflow used to clone PeterC66/buses-data
# with CROSS_REPO_PAT2 to read the two fixture packs. That token expires on
# Sunday 22 November 2026, and this repository requires `verify` and forbids
# bypassing -- so its expiry would have blocked every pull request here outright
# until somebody turned branch protection off. Renewing it bought one more year
# of the same cliff.
#
# The fixtures are now VENDORED, under `gate-fixtures/`, and `scripts/lib/fixtures.mjs`
# looks there first. So this job clones one repository, at the commit that
# triggered it, and its verdict is about that commit alone. It used to depend on
# whatever buses-data's `main` held the minute it ran: that produced a truthful
# red on PR #107 (a v1.14 reference measured against a v1.15 engine) and, in the
# other direction and far more dangerously, a false GREEN whenever buses-data was
# AHEAD of what the commit was written against.
#
# WHAT IS NOT LOST. Whether the vendored copy has fallen behind buses-data is a
# real question, and it is now asked where it can be answered for free: from the
# laptop, and as a step in buses-data's own `gates.yml`, which clones this public
# repository with no credential. `npm run fixtures:vendor` is the read-only form,
# and `scripts/prove-red-vendored-fixtures.mjs` -- which runs in `npm test` --
# is what proves it can go red. `gate-fixtures/README.md` states the whole chain.
#
# The predecessor CROSS_REPO_PAT and CROSS_REPO_PAT2 itself are no longer named
# by any workflow in this repository. Deleting a secret from the Actions and
# Dependabot stores here is OA-398 step 4.

name: verify (byte-identical)

# ONE RUN PER REF (OA-232 Tier 2.3, the 2026-09-03 review's portal-ops W2).
# None of the four workflows had a concurrency group, so a second push to a PR
# left the first run going: two runs of the byte gates against the same branch,
# competing for the same self-hosted-shaped work, and a stale run able to finish
# AFTER the new one and be the last verdict a reader sees. `cancel-in-progress`
# is safe for every job here because none of them writes anything outside its own
# runner -- these are checks, not deploys.
#
# THE GROUP INCLUDES THE EVENT NAME (2026-09-04, OA-242), and that is
# load-bearing rather than tidy. On `main` the events `push`, `schedule` and
# `workflow_dispatch` all resolve `github.ref` to `refs/heads/main`, so without
# the event name they share one group and a push CANCELS a scheduled run --
# and `verify.yml` (daily) and `audit.yml` (Mondays) are scheduled precisely
# because they can break with nobody touching this repository. A push must not
# be able to cancel the run that carries a guarantee. The full reasoning is in
# buses-data `.github/workflows/gates.yml`, whose group has had this form since
# 2026-09-03; these four were written first and were never backported.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
  pull_request:
  # Daily. THE OLD REASON HAS GONE and the schedule has a new one (OA-398): it
  # used to be that the fixture lived in buses-data and moved when the engine did,
  # which is no longer true of anything this job reads. What can still break it
  # with nobody touching this repository is the RUNNER -- ubuntu-latest moves, and
  # the Node this job runs is derived from the Dockerfile rather than pinned here,
  # so a change in what `node:<major>-slim` resolves to arrives without a commit.
  # A daily run on a public repository is billed nothing.
  schedule:
    - cron: '35 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the portal
        uses: actions/checkout@v7
        with:
          path: community-bus-maps

      # ONE CHECKOUT, AND THAT IS THE CHANGE (OA-398). There were three steps
      # here: a preflight that asked GitHub whether CROSS_REPO_PAT2 could still
      # read buses-data and printed its expiry, a token-bearing sparse checkout of
      # that private repository, and an `ls` proving the sparse paths were right.
      # All three existed to make a cross-repository read legible when it failed,
      # and none of them is needed now that there is no cross-repository read. The
      # fixtures are in `gate-fixtures/`, vendored, and `scripts/lib/fixtures.mjs`
      # looks there first.
      #
      # THE SPARSE CHECKOUT LEFT A LESSON WORTH KEEPING even though the step has
      # gone: it listed the paths the gates read, and adding a step that read one
      # more meant editing that list. It went red on its first run for exactly
      # that reason on 2026-09-11. The general form — a job that reaches into
      # another repository carries a list of what it reaches for, and the only
      # thing that says the list is wrong is a red run — is why this workflow no
      # longer reaches.

      # Named out loud so a red run's cause is legible from the step list. If this
      # ever reports nothing, the fixtures did not come down with the checkout,
      # which is a broken job and not a passing one; the scripts below say so
      # themselves rather than skipping.
      - name: Fixtures present?
        working-directory: community-bus-maps
        run: |
          echo "gate-fixtures/Areas/_portal-fixture:"; ls -la gate-fixtures/Areas/_portal-fixture
          echo "gate-fixtures/Places/_portal-fixture:"; ls -la gate-fixtures/Places/_portal-fixture

      # Read the major out of the Dockerfile rather than hardcoding it. This job
      # exists to run the gates on the same Node the deployment image runs, and a
      # hardcoded major keeps passing after a base-image bump while quietly
      # testing the wrong runtime -- a green check that has stopped meaning what
      # its name says. Fails loudly if the FROM line cannot be read, because
      # silently falling back to a default is the same bug again.
      - name: What Node does the deployment image use?
        id: nodever
        working-directory: community-bus-maps
        run: |
          major=$(sed -n 's/^FROM node:\([0-9][0-9]*\).*/\1/p' Dockerfile | head -1)
          if [ -z "$major" ]; then
            echo "::error::could not read a Node major from the Dockerfile FROM line"
            exit 1
          fi
          echo "  Dockerfile FROM node:$major-slim -> testing on Node $major"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodever.outputs.major }}

      - name: Install dependencies
        working-directory: community-bus-maps
        run: npm ci

      # WHICH COMMIT IS THIS VERDICT ABOUT? It was WHICH TWO, and losing the
      # second is the point of OA-398 rather than a casualty of it.
      #
      # The portal is checked out at the triggering commit. The fixtures used to
      # come from buses-data at whatever its `main` held THE MINUTE THIS JOB RAN,
      # because that checkout named no `ref:` -- so a verdict was about a pairing
      # that existed for the minutes the job ran and might never exist again. On
      # 2026-08-27 that produced a truthful red on PR #107, a v1.14 reference of
      # 182,804 B measured against a v1.15 engine writing 184,751 B, cleared by
      # nothing but a re-run once buses-data had been pushed. The same mechanism
      # yielded a false GREEN whenever buses-data was AHEAD of what the commit was
      # written against, which is the dangerous direction and is precisely the
      # state a real drift would have had to be noticed through.
      #
      # This step stays because attribution is worth having even when there is one
      # SHA to attribute: it is what turns "verify was green on Tuesday" into
      # "verify was green for THIS commit". It cannot fail the job on its own --
      # it reads a SHA out of a checkout an earlier step already made, and asserts
      # nothing.
      - name: Which commit is this verdict about
        run: |
          {
            echo "### Checked out for this run"
            echo
            echo "| Repository | Ref | SHA |"
            echo "|---|---|---|"
            sha=$(git -C "$GITHUB_WORKSPACE/community-bus-maps" rev-parse HEAD)
            ref=$(git -C "$GITHUB_WORKSPACE/community-bus-maps" rev-parse --abbrev-ref HEAD)
            echo "| \`community-bus-maps\` | $ref — pinned to the triggering commit | \`${sha:0:10}\` |"
            echo
            echo "The fixtures are this repository's own, under \`gate-fixtures/\`, so there is no second"
            echo "commit in this verdict and no floating ref. Whether that copy is still in step with"
            echo "buses-data is asked by \`npm run fixtures:vendor\`, from the laptop and from buses-data's"
            echo "own gates workflow."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # EVERYTHING BELOW THIS LINE CARRIES `if: ${{ !cancelled() }}`, AND THIS
      # STEP IS THE LINE (buses-data's 2026-09-14 review, W8, its Tier 1.5).
      #
      # A job's steps run in order and a failure skips the rest, so until now this
      # workflow's verdict named only its FIRST fault: 0 conditions across 310
      # lines. Six independent gates, one answer. That is the estate's named shape
      # *the blocker behind the blocker* — landing OA-338 met four reds one at a
      # time over seven hours, every one of them answerable locally in two minutes,
      # because each rerun could only reveal the next one. A cross-repository byte
      # gate is the worst place to pay that: each round trip is a push to the other
      # repository and a fresh checkout here.
      #
      # WHY THE LINE IS HERE AND NOT HIGHER. Everything above is a PRECONDITION —
      # the checkout, the fixture listing, the Node version read off the
      # deployment image, `npm ci`, and the attribution step. If any of them fails
      # the gates below cannot run at all, and five identical "fixtures missing"
      # failures would be noise rather than information. (It used to name a PAT
      # preflight and a second checkout as well; OA-398 removed both, and the
      # argument for the line is unchanged by that.) Everything below is an independent
      # VERDICT about the code, and each is worth having even when a sibling is
      # red. `!cancelled()` rather than `always()` deliberately: a job somebody
      # cancelled, or one that hit the runner's timeout, must still stop.
      #
      # It does NOT weaken the job. A step that fails still fails the job; this
      # only decides whether its siblings are asked their question first. Read it
      # as load-bearing rather than boilerplate — buses-data bought exactly this
      # fix in `gates.yml` when it merged its docs job into `status`, and recorded
      # there that without the condition the merge trades money for a check that
      # reports only when everything else already passed.
      # ---------------------------------------------------------------------

      # TWO PROVE-REDS USED TO RUN HERE AND NO LONGER DO (OA-232 Tier 2.3, the
      # 2026-09-03 review's portal-ops W6). `test:prove-red-fixture-drift` and
      # `test:prove-red-engine-source` were added here, before the byte gates
      # that trust what they falsify, at a time when this was the only workflow
      # that could reach them. Since 2026-09-02 `npm test` is a RUNNER that
      # discovers every `prove-red-*.mjs` and `test-*.mjs` under `scripts/`, and
      # `test.yml` runs it on every push and PR — so both were running twice per
      # push, and the copies here were the ones behind the cross-repo PAT.
      #
      # Neither needs the fixture repository: the drift one builds seven scratch
      # trees under the temp dir, the engine-source one is filesystem only. That
      # is exactly why they can live in the job with no secrets and no cross-repo
      # checkout, where a PAT expiry cannot take them down with the byte gates.
      # `run-tests.mjs` refuses to skip a discovered file without a reason naming
      # where it DOES run, so nothing can quietly drop out of that suite.

      # THE VENDORED BUS-MAP DIRECTORY CHECK HAS MOVED, AND IT HAS NOT BEEN
      # DROPPED (OA-398). `public/data/bus-map-directory.json` is a projection of a
      # file in buses-data -- the fields the /maps search panel renders, with the
      # survey notes deliberately left behind in the private repository -- and
      # `npm run sync:directory -- --check` compared the two. It ran here because
      # this was the only workflow with a buses-data checkout. It now runs in
      # buses-data's own `gates.yml`, which clones this PUBLIC repository for
      # nothing, so the comparison still happens every day and happens in the suite
      # that fires when the SOURCE changes, which is OA-218's rule.
      #
      # `npm test` still asserts the vendored file's shape here, and still says in
      # its own header that it cannot ask whether the content is current. Read that
      # as the division of labour rather than a gap: this repository can say the
      # projection is well-formed; only a machine holding both trees can say it is
      # in step.

      - name: verify:area — the portal reproduces a shipped town sheet
        if: ${{ !cancelled() }}
        working-directory: community-bus-maps
        run: npm run verify:area

      - name: verify:place — the vendored place engine reproduces a shipped place sheet
        if: ${{ !cancelled() }}
        working-directory: community-bus-maps
        run: npm run verify:place

      - name: verify:defaults — every design/labels escape hatch is still live code
        if: ${{ !cancelled() }}
        working-directory: community-bus-maps
        run: npm run verify:defaults

      # The one gate that runs on a machine WITHOUT the skill tree, which is the
      # only place the question can honestly be asked. Every generator's
      # last-resort module resolution is a hardcoded path into the skill
      # checkout; on the laptop that folder exists, so a module this repository
      # was never given still resolves and the sheet still renders. Here it does
      # not exist, and a missing module is MODULE_NOT_FOUND — which is what the
      # server would have done. Added 2026-08-27 after check-vendored.mjs
      # reported "every module they require is here" about a generator requiring
      # four modules that were not here.
      # FALSIFY IT FIRST, and it runs first for the reason every prove-red in
      # this project runs first: the gate below prints a tick per sheet, and
      # until 2026-08-30 it rendered ONE of the four it certified. It was widened
      # (OA-051) to run every generator the fixture's routes.json declares — and
      # a widened gate that has only ever been seen green is precisely the fault
      # it was widened to fix. Three mutations, each of which must turn ONE arm
      # red on its own: `engine/dash_fit.js` (the external sheet began requiring
      # it at load on 2026-08-30, which is the gap the row recorded),
      # `engine/expert/schematize_internal.js` (the P7 arms run two processes
      # down, so this is what proves the module recorder gets there at all), and
      # a fixture with one sheet removed from its routes.json, which is the
      # coverage property itself and the one thing a verdict cannot express.
      # Plus an intact control, because every arm going red at once would mean
      # the scratch copy was broken and not the gate. ~30 s.
      - name: prove the self-sufficiency gate can go red
        if: ${{ !cancelled() }}
        working-directory: community-bus-maps
        run: npm run test:prove-red-selfsufficient

      - name: self-sufficient — the engine renders with nothing but this repo
        if: ${{ !cancelled() }}
        working-directory: community-bus-maps
        run: npm run test:selfsufficient
