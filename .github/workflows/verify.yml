# The byte-identical gate, running somewhere other than one laptop.
#
# This is the workflow the audit asked for
# (Development Docs/technical-audit_2026-08-19.md, finding V2 — "the one thing
# to fix if only one thing gets fixed"). The product's central technical claim is
# that the same inputs produce the same bytes. `npm run verify` is what
# demonstrates that claim, and until 2026-08-20 it could only be demonstrated by
# the founder, on one machine, because the fixtures it needs were git-ignored —
# and it printed "skipping" and exited 0 everywhere else, so the absence looked
# like a pass.
#
# Both halves of the fix are needed for this file to mean anything:
#   1. buses-data now COMMITS an area fixture at Areas/_portal-fixture/, the way
#      it already committed a place one at Places/_portal-fixture/;
#   2. scripts/lib/fixtures.mjs FAILS rather than skips when there is no fixture,
#      so this job cannot go green by finding nothing.
#
# WHY THE THREE GATES ARE THREE STEPS rather than one `npm run verify`. They
# answer different questions and a reader of a red run should not have to open
# the log to learn which: verify:area is "does the portal reproduce a shipped
# TOWN sheet byte-for-byte", verify:place is the same for the vendored PLACE
# engine, and verify:defaults is "does each of the thirteen design/labels escape
# hatches still change something" — i.e. is any of them now dead code.
#
# WHAT THIS DOES NOT PROVE. Rasterisation. SVG generation is pure JavaScript and
# is expected to be byte-identical everywhere; the JPGs are not, because glyph
# outlines differ between Linux and the Windows laptop by design. That is what
# render-parity.yml is for, and why these gates compare SVGs only.
#
# REQUIRES the secret CROSS_REPO_PAT2: a GitHub PAT with read access to
# PeterC66/buses-data. Both repositories are private, and a job's own
# GITHUB_TOKEN is scoped to this repository alone. The preflight step below says
# so in one line if it is missing or under-scoped, rather than letting it surface
# as a checkout `Not Found` that reads like a deleted repository — which is
# exactly how the sibling workflow in buses-data managed to stay red for twelve
# days without anyone noticing.
#
# THIS REPOSITORY NEEDS THE SECRET IN TWO STORES, NOT ONE. This job runs on
# `pull_request`, and a pull request opened by Dependabot reads the DEPENDABOT
# secret store, never the Actions one. A token added only under Actions leaves
# every Dependabot PR failing at the preflight below while every human PR passes
# -- so add it under Settings -> Secrets and variables -> BOTH Actions and
# Dependabot, and change them together.
#
# ONE token, FOUR stores, and they renew together: this repo's Actions and
# Dependabot stores, buses-data Actions, and claude-skills Actions. The
# 2026-08-21 rotation updated three and missed the fourth, which cost six weeks
# of a gate that could not run. CROSS_REPO_PAT2 expires Sunday 22 November 2026;
# when it does, this job and both repos' `Bus leaflet gates` fail at once. Its
# predecessor CROSS_REPO_PAT is no longer named by any workflow in any of the
# three repos (migrated 2026-08-24).

name: verify (byte-identical)

# OA-251: a GitHub "Run failed" email names the RUN, so a commit subject that
# BEGINS [expected-red] says so in the email's SUBJECT line and Peter can
# delete it unread. No marker means nobody predicted it. This buys grace and
# not amnesty: bus-work's ci_state.mjs ranks a marked red at 8 for six hours
# and at 0 BROKEN after that, so it cannot become a way to leave CI red. It is
# for a red a session has decided to accept for a few minutes -- the cross-repo
# ordering trap in buses-data's CLAUDE.md is fixed by pushing in the right
# order, never by labelling the result.
#
# IT MUST START THE SUBJECT, and startsWith is why. head_commit.message is the
# WHOLE message, body and all: the first version of this used contains(), and
# it fired on the very first commit here -- whose body merely described the
# convention. A paragraph about the marker can never begin with it.
#
# head_commit is null on pull_request, schedule and workflow_dispatch, where
# startsWith() casts it to '' and the workflow's own name below is used.
run-name: >-
  ${{ startsWith(github.event.head_commit.message, '[expected-red]')
  && 'EXPECTED RED - a session predicted this, no action'
  || 'verify (byte-identical)' }}

# ONE RUN PER REF (OA-232 Tier 2.3, the 2026-09-03 review's portal-ops W2).
# None of the four workflows had a concurrency group, so a second push to a PR
# left the first run going: two runs of the byte gates against the same branch,
# competing for the same self-hosted-shaped work, and a stale run able to finish
# AFTER the new one and be the last verdict a reader sees. `cancel-in-progress`
# is safe for every job here because none of them writes anything outside its own
# runner -- these are checks, not deploys.
#
# THE GROUP INCLUDES THE EVENT NAME (2026-09-04, OA-242), and that is
# load-bearing rather than tidy. On `main` the events `push`, `schedule` and
# `workflow_dispatch` all resolve `github.ref` to `refs/heads/main`, so without
# the event name they share one group and a push CANCELS a scheduled run --
# and `verify.yml` (daily) and `audit.yml` (Mondays) are scheduled precisely
# because they can break with nobody touching this repository. A push must not
# be able to cancel the run that carries a guarantee. The full reasoning is in
# buses-data `.github/workflows/gates.yml`, whose group has had this form since
# 2026-09-03; these four were written first and were never backported.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
  pull_request:
  # Daily, because this gate can break without anyone touching this repository:
  # the fixture lives in buses-data and moves when the engine does.
  schedule:
    - cron: '35 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Preflight — can the PAT see buses-data?
        env:
          PAT: ${{ secrets.CROSS_REPO_PAT2 }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::CROSS_REPO_PAT2 is not set on this repository. Add it under Settings -> Secrets and variables -> Actions, with read access to PeterC66/buses-data."
            exit 1
          fi
          # Ask the credential when it dies rather than trusting a date typed
          # into the comment above. GitHub returns a
          # github-authentication-token-expiration header on any request
          # authenticated with a PAT that expires. Until 2026-08-24 the date in
          # this file came from a previous session's notes and had never been
          # read back off the token itself; a third token in the account,
          # carrying a third date, is what exposed that. Now every run prints it.
          exp=$(curl -sS -D - -o /dev/null -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/PeterC66/buses-data" | sed -n 's/^github-authentication-token-expiration: *//Ip' | tr -dc '[:print:]')
          if [ -n "$exp" ]; then
            echo "  this token expires: $exp"
          else
            echo "::warning::GitHub reported no token-expiry header, so the date in this file's header comment is unverified."
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/PeterC66/buses-data")
          if [ "$code" != "200" ]; then
            echo "::error::CROSS_REPO_PAT2 cannot read PeterC66/buses-data (HTTP $code). Widen the token's repository access."
            exit 1
          fi
          echo "  ok   PeterC66/buses-data"

      - name: Checkout the portal
        uses: actions/checkout@v7
        with:
          path: community-bus-maps

      # Sparse: the fixtures are a few MB, the rest of that repository is
      # hundreds. cone mode with two directories keeps the checkout to what the
      # gates actually read.
      - name: Checkout buses-data (the fixtures)
        uses: actions/checkout@v7
        with:
          repository: PeterC66/buses-data
          token: ${{ secrets.CROSS_REPO_PAT2 }}
          path: buses-data
          sparse-checkout: |
            Areas/_portal-fixture
            Places/_portal-fixture
          sparse-checkout-cone-mode: true

      # Read the major out of the Dockerfile rather than hardcoding it. This job
      # exists to run the gates on the same Node the deployment image runs, and a
      # hardcoded major keeps passing after a base-image bump while quietly
      # testing the wrong runtime -- a green check that has stopped meaning what
      # its name says. Fails loudly if the FROM line cannot be read, because
      # silently falling back to a default is the same bug again.
      - name: What Node does the deployment image use?
        id: nodever
        working-directory: community-bus-maps
        run: |
          major=$(sed -n 's/^FROM node:\([0-9][0-9]*\).*/\1/p' Dockerfile | head -1)
          if [ -z "$major" ]; then
            echo "::error::could not read a Node major from the Dockerfile FROM line"
            exit 1
          fi
          echo "  Dockerfile FROM node:$major-slim -> testing on Node $major"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodever.outputs.major }}

      - name: Install dependencies
        working-directory: community-bus-maps
        run: npm ci

      # WHICH TWO COMMITS IS THIS VERDICT ABOUT? (buses-data OA-018, portal half,
      # added 2026-09-05.) The portal is checked out at the triggering commit;
      # the fixtures come from buses-data at whatever its `main` holds THE MINUTE
      # THIS JOB RUNS, because the checkout above names no `ref:`. So a verdict
      # here is a statement about a pairing that existed for the minutes this job
      # ran and may never exist again. On 2026-08-27 that produced a truthful red
      # on PR #107 -- a v1.14 reference of 182,804 B measured against a v1.15
      # engine writing 184,751 B -- cleared by nothing but a re-run once
      # buses-data had been pushed. The same mechanism yields a false GREEN
      # whenever buses-data is AHEAD of what the commit was written against.
      #
      # REPORT, DON'T PIN, the same decision buses-data's own gates.yml took on
      # 2026-08-28. Pinning the fixtures would make the gate reproducible and
      # blind to exactly the drift it exists to catch -- "does today's portal
      # still reproduce this sheet" is a question about today. Naming both SHAs
      # in the log and the step summary is what turns "verify was green on
      # Tuesday" into "verify was green for THIS pairing", so a later red can be
      # diffed against a known-good one. The habit that avoids the red is in
      # buses-data's CLAUDE.md: push buses-data BEFORE opening a portal PR that
      # depends on it, and read the POST-merge run rather than a PR's own checks.
      - name: Which two commits is this verdict about
        run: |
          {
            echo "### Checked out for this run"
            echo
            echo "| Repository | Ref | SHA |"
            echo "|---|---|---|"
            for d in community-bus-maps buses-data; do
              sha=$(git -C "$GITHUB_WORKSPACE/$d" rev-parse HEAD)
              ref=$(git -C "$GITHUB_WORKSPACE/$d" rev-parse --abbrev-ref HEAD)
              pin='floats on its default branch'
              [ "$d" = community-bus-maps ] && pin='pinned to the triggering commit'
              echo "| \`$d\` | $ref — $pin | \`${sha:0:10}\` |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Named out loud so a red run's cause is legible from the step list.
      # If this ever reports "no fixture", the sparse-checkout above is wrong —
      # that is a broken job, not a passing one, and the scripts say so.
      - name: Fixtures present?
        run: |
          echo "Areas/_portal-fixture:"; ls -la buses-data/Areas/_portal-fixture
          echo "Places/_portal-fixture:"; ls -la buses-data/Places/_portal-fixture

      # TWO PROVE-REDS USED TO RUN HERE AND NO LONGER DO (OA-232 Tier 2.3, the
      # 2026-09-03 review's portal-ops W6). `test:prove-red-fixture-drift` and
      # `test:prove-red-engine-source` were added here, before the byte gates
      # that trust what they falsify, at a time when this was the only workflow
      # that could reach them. Since 2026-09-02 `npm test` is a RUNNER that
      # discovers every `prove-red-*.mjs` and `test-*.mjs` under `scripts/`, and
      # `test.yml` runs it on every push and PR — so both were running twice per
      # push, and the copies here were the ones behind the cross-repo PAT.
      #
      # Neither needs the fixture repository: the drift one builds seven scratch
      # trees under the temp dir, the engine-source one is filesystem only. That
      # is exactly why they can live in the job with no secrets and no cross-repo
      # checkout, where a PAT expiry cannot take them down with the byte gates.
      # `run-tests.mjs` refuses to skip a discovered file without a reason naming
      # where it DOES run, so nothing can quietly drop out of that suite.

      - name: verify:area — the portal reproduces a shipped town sheet
        working-directory: community-bus-maps
        env:
          BUSES_DIR: ${{ github.workspace }}/buses-data
        run: npm run verify:area

      - name: verify:place — the vendored place engine reproduces a shipped place sheet
        working-directory: community-bus-maps
        env:
          BUSES_DIR: ${{ github.workspace }}/buses-data
        run: npm run verify:place

      - name: verify:defaults — every design/labels escape hatch is still live code
        working-directory: community-bus-maps
        env:
          BUSES_DIR: ${{ github.workspace }}/buses-data
        run: npm run verify:defaults

      # The one gate that runs on a machine WITHOUT the skill tree, which is the
      # only place the question can honestly be asked. Every generator's
      # last-resort module resolution is a hardcoded path into the skill
      # checkout; on the laptop that folder exists, so a module this repository
      # was never given still resolves and the sheet still renders. Here it does
      # not exist, and a missing module is MODULE_NOT_FOUND — which is what the
      # server would have done. Added 2026-08-27 after check-vendored.mjs
      # reported "every module they require is here" about a generator requiring
      # four modules that were not here.
      # FALSIFY IT FIRST, and it runs first for the reason every prove-red in
      # this project runs first: the gate below prints a tick per sheet, and
      # until 2026-08-30 it rendered ONE of the four it certified. It was widened
      # (OA-051) to run every generator the fixture's routes.json declares — and
      # a widened gate that has only ever been seen green is precisely the fault
      # it was widened to fix. Three mutations, each of which must turn ONE arm
      # red on its own: `engine/dash_fit.js` (the external sheet began requiring
      # it at load on 2026-08-30, which is the gap the row recorded),
      # `engine/expert/schematize_internal.js` (the P7 arms run two processes
      # down, so this is what proves the module recorder gets there at all), and
      # a fixture with one sheet removed from its routes.json, which is the
      # coverage property itself and the one thing a verdict cannot express.
      # Plus an intact control, because every arm going red at once would mean
      # the scratch copy was broken and not the gate. ~30 s.
      - name: prove the self-sufficiency gate can go red
        working-directory: community-bus-maps
        env:
          BUSES_DIR: ${{ github.workspace }}/buses-data
        run: npm run test:prove-red-selfsufficient

      - name: self-sufficient — the engine renders with nothing but this repo
        working-directory: community-bus-maps
        env:
          BUSES_DIR: ${{ github.workspace }}/buses-data
        run: npm run test:selfsufficient
