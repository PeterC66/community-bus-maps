# Single-VM deployment (P7). One service, one volume, a reverse proxy in front.
# See docs/DEPLOY.md for TLS, backups and the restore drill.

services:
  portal:
    build:
      context: .
      # GO-LIVE.md §5 release loop step 3-4: export these in the shell before
      # `docker compose up -d --build` (e.g. `export GIT_SHA=$(git rev-parse
      # --short HEAD) BUILT_AT=$(date -u +%FT%TZ)`), or they default to
      # "unknown" — see the Dockerfile ARG comment.
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-}
    image: community-bus-maps:local
    restart: unless-stopped
    # Bound to loopback: TLS + the public hostname belong to the reverse proxy.
    ports:
      - "127.0.0.1:5180:5180"
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      # The public base URL used in robots.txt + sitemap.xml (P6).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Magic-link email. Unset = links are printed to the container log (dev only).
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Set to expose /metrics to a scraper (unset = /metrics is hidden).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Set to accept POST /api/admin/status (the laptop's push-status.mjs).
      STATUS_TOKEN: ${STATUS_TOKEN:-}
      # Set to let the laptop's bus-work worklist READ /api/admin/worklist and
      # /api/maps without a person's sign-in session (OA-203). Read-only: GET
      # only, those two routes only, unset = nobody is admitted.
      #
      # THIS LINE IS THE FOURTH TIME THE TRAP BELOW HAS BEEN SPRUNG, and the
      # first time by somebody who had read the warning. On 2026-08-31 the token
      # was written into the host .env, the deploy recreated the container, and
      # the live worklist still got 401 — .env said len 43, the container said
      # len 0. The warning is in this file, and this file is not where you go
      # when you add a config variable; .env.example and docs/DEPLOY.md are, and
      # neither of them said to come here. Both now do, and
      # scripts/check-compose-env.mjs turns the whole paragraph into a check.
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      # How many months before a published map's data is labelled stale on the
      # public pages (src/public/services.js; empty = the built-in 6). Named
      # here because it was reachable from nowhere: not in .env.example and not
      # in this file, so an operator who set it in .env would have changed
      # nothing and been told nothing. Found by the same check, 2026-08-31.
      STALE_AFTER_MONTHS: ${STALE_AFTER_MONTHS:-}
      # Defaults ON in src/config.js if truly unset, but be explicit here so a
      # blank .env value doesn't accidentally fall through to that default.
      PILOT_MODE: ${PILOT_MODE:-1}
      # Search-engine indexing, split from PILOT_MODE on 2026-08-21. Defaults
      # OFF — robots.txt serves `Disallow: /` until this is 1.
      ALLOW_INDEXING: ${ALLOW_INDEXING:-0}
      # Separation of duties (technical-audit_2026-08-19 S6). With a single
      # operator this MUST be 1 or nothing can be published at all; each
      # publication made under it is stamped `selfApproved: true` in the
      # decision evidence and the audit row.
      ALLOW_SELF_APPROVAL: ${ALLOW_SELF_APPROVAL:-}
      #
      # WHY EVERY VARIABLE THE APP READS MUST BE NAMED HERE. This service has
      # no `env_file`. Compose reads .env only to substitute ${VARS} into THIS
      # file, so a key that is not listed above never reaches the container,
      # however correctly it is spelled in .env. Both flags above were added on
      # 2026-08-21 after exactly that trap was found: two PR bodies said "set
      # ALLOW_SELF_APPROVAL=1 in the host .env", which on its own would have
      # been a line sitting in .env looking correct while the app ran without
      # it and refused every publication — with nothing to say so.
      #
      # IT IS NO LONGER ONLY A COMMENT. `npm run check:compose-env` reads every
      # `process.env.X` under src/ and requires each one to be named here, or in
      # the Dockerfile's own ENV, or in that script's exemption table WITH A
      # WRITTEN REASON. It runs in `npm test`. A comment cannot be three-for-
      # three wrong and stay a comment.
    volumes:
      - portal-data:/data
      # Backups written outside DATA_DIR so a backup is never inside the next one.
      - ./backups:/backups

  # Run on a timer (host cron / systemd timer) rather than continuously:
  #   docker compose run --rm backup
  backup:
    profiles: ["tools"]
    image: community-bus-maps:local
    environment:
      DATA_DIR: /data
      # The age PUBLIC key the database copy is encrypted to
      # (technical-audit_2026-08-25 N3). Named here for the same reason the
      # portal's two flags above are — and the trap was live again on
      # 2026-08-25: this service has no `env_file`, cron runs it as
      # `docker compose run --rm backup`, and the plan was to add
      # BACKUP_RECIPIENT to the host .env alone. It would never have reached the
      # container. backup.mjs would have taken its unset branch and every
      # nightly backup would have gone on writing the database in clear, behind
      # a warning in a cron log nobody reads, while the key sat in .env looking
      # correct.
      #
      # Empty is a supported state, not a broken one: unset means plaintext and
      # backup.mjs says so on every run. What must never happen is a key that is
      # SET and silently not delivered.
      BACKUP_RECIPIENT: ${BACKUP_RECIPIENT:-}
    volumes:
      - portal-data:/data
      - ./backups:/backups
    # --keep-days is the real retention window; --keep is only the floor that
    # stops an age rule emptying the directory if the cron dies for a month.
    # It was `--keep 14` alone until 2026-08-28, which meant 14 FOLDERS, not 14
    # days: a dozen manual backups in one working day cut the whole window to 25
    # hours. src/ops/backup-retention.js has the incident.
    command: ["node", "scripts/backup.mjs", "--out", "/backups", "--keep-days", "14", "--keep", "7"]

volumes:
  portal-data:
